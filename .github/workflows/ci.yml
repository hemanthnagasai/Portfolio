name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build

  e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Playwright's webServer boots uvicorn serving the built dist + API,
      # exactly like the production container. No Gemini key needed — the
      # smoke tests never trigger generation.
      - name: Run smoke tests
        working-directory: frontend
        run: npm run test:e2e

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    # Builds and runs the ACTUAL production image, then hits the endpoints.
    # This is the only job that catches "works in source, missing/broken in
    # the image" bugs (e.g. a runtime file the Dockerfile didn't COPY) —
    # the source-tree pytest/e2e jobs cannot see them.
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t portfolio-ci .
      - name: Run container
        run: docker run -d --name portfolio -p 8000:8000 portfolio-ci
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health; then echo " -> healthy"; exit 0; fi
            sleep 2
          done
          echo "container never became healthy"; docker logs portfolio; exit 1
      - name: Resume endpoint serves a real PDF
        run: |
          code=$(curl -s -o resume.pdf -w "%{http_code}" http://localhost:8000/api/resume/download)
          echo "status: $code"
          test "$code" = "200"
          head -c 4 resume.pdf | grep -q "%PDF"
          echo "resume OK ($(wc -c < resume.pdf) bytes)"
      - name: SPA shell is served
        run: curl -sf http://localhost:8000/ | grep -q '<div id="root">'
      - name: Teardown
        if: always()
        run: docker rm -f portfolio || true
