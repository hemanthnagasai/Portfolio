<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#EEEEDD" />
        <meta name="description" content="Associate Consultant — Hemanth Chakka" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Hemanth Naga Sai Chakka" />
        <meta property="og:description" content="Associate Consultant — Hemanth Chakka" />
        <meta property="og:image" content="https://portfolio-r2vv.onrender.com/og-banner.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:url" content="https://portfolio-r2vv.onrender.com/" />
        <link rel="canonical" href="https://portfolio-r2vv.onrender.com/" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Hemanth Naga Sai Chakka" />
        <meta name="twitter:description" content="Associate Consultant — Hemanth Chakka" />
        <meta name="twitter:image" content="https://portfolio-r2vv.onrender.com/og-banner.png" />

        <!-- Structured data: how search engines understand who this site is about.
             A non-executable data block, so CSP script-src does not apply. -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Hemanth Naga Sai Chakka",
            "jobTitle": "Associate Consultant",
            "worksFor": { "@type": "Organization", "name": "Ernst & Young LLP" },
            "alumniOf": { "@type": "CollegeOrUniversity", "name": "KITS, Guntur" },
            "address": { "@type": "PostalAddress", "addressLocality": "Mangalagiri, Guntur", "addressCountry": "IN" },
            "url": "https://portfolio-r2vv.onrender.com/",
            "image": "https://portfolio-r2vv.onrender.com/portrait.webp",
            "sameAs": [
                "https://www.linkedin.com/in/hemanthchakka/",
                "https://github.com/hemanthnagasai",
                "https://www.instagram.com/hemanth_chakka/",
                "https://www.instagram.com/hemanth_.sings_/"
            ]
        }
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Loaded as a non-blocking preload + async stylesheet swap (instead of a CSS @import,
             which forces the browser to fully parse the stylesheet before even discovering this
             request) so font loading doesn't delay first paint. The media="print" -> "all"
             swap happens in index.tsx rather than an inline onload handler, which the
             Content-Security-Policy (script-src 'self') would block. -->
        <link
          rel="preload"
          as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Anek+Telugu:wght@800&family=JetBrains+Mono:wght@400;500&display=swap"
        />
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Anek+Telugu:wght@800&family=JetBrains+Mono:wght@400;500&display=swap"
          media="print"
          data-async-font
        />
        <noscript>
          <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Anek+Telugu:wght@800&family=JetBrains+Mono:wght@400;500&display=swap"
          />
        </noscript>
        <title>Hemanth Naga Sai Chakka</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
